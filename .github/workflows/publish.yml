name: Publish Skills to Tessl

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Tessl Workspace
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_API_KEY }}

      - run: tessl tile publish
